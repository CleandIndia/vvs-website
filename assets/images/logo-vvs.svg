<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 140" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Vijay Vikram Singh</title>
  <desc id="logoDesc">High contrast VVS monogram with Vijay Vikram Singh wordmark</desc>
  <defs>
    <linearGradient id="vvsGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3A3"/>
      <stop offset="0.42" stop-color="#D3A144"/>
      <stop offset="1" stop-color="#9A6A25"/>
    </linearGradient>
  </defs>
  <rect width="720" height="140" fill="none"/>
  <g>
    <text x="8" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700" letter-spacing="-2" fill="url(#vvsGold)">VVS</text>
    <line x1="176" y1="24" x2="176" y2="116" stroke="#D3A144" stroke-width="2" opacity="0.9"/>
    <text x="198" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" letter-spacing="4.5" fill="#FFF8EA">VIJAY VIKRAM SINGH</text>
    <text x="201" y="86" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" letter-spacing="4.2" fill="#E2B55F">NARRATOR  |  ACTOR  |  SPEAKER  |  COACH</text>
    <line x1="201" y1="106" x2="610" y2="106" stroke="#D3A144" stroke-width="1.4" opacity="0.65"/>
  </g>
</svg>
